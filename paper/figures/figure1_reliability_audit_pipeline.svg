<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500" role="img" aria-labelledby="title desc">
  <title id="title">Five-pillar point-in-time reliability-audit pipeline</title>
  <desc id="desc">A publication diagram showing the point-in-time foundation, numerical VMD branch, Local NLP and Bull-Bear-Leader news branches, causal market-regime and train-only SHAP branch, five frozen neural architectures, SET50 forecasting contract, and partial-2026 and SET100 robustness evaluations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .h1 { font-size: 31px; font-weight: 700; fill: #0F172A; }
      .h2 { font-size: 25px; font-weight: 700; fill: #0F172A; }
      .body { font-size: 22px; font-weight: 600; fill: #1E293B; }
      .small { font-size: 19px; font-weight: 500; fill: #334155; }
      .tiny { font-size: 17px; font-weight: 500; fill: #475569; }
      .white { fill: #FFFFFF; }
      .line { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
      .line-thin { fill: none; stroke: #64748B; stroke-width: 3; marker-end: url(#arrow); }
      .eval-line { fill: none; stroke: #0F766E; stroke-width: 3.5; stroke-dasharray: 11 9; marker-end: url(#arrowTeal); }
      .box { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2.5; rx: 16; }
    </style>
  </defs>

  <rect width="2000" height="1500" fill="#FFFFFF"/>

  <!-- Pillar 1: shared foundation -->
  <g filter="url(#shadow)">
    <rect x="70" y="45" width="1860" height="155" rx="22" fill="#E8EEF7" stroke="#1E3A5F" stroke-width="3"/>
    <rect x="70" y="45" width="235" height="155" rx="22" fill="#1E3A5F"/>
    <text class="sans h2 white" x="188" y="102" text-anchor="middle">PILLAR 1</text>
    <text class="sans body white" x="188" y="140" text-anchor="middle">POINT-IN-TIME</text>
    <text class="sans body white" x="188" y="170" text-anchor="middle">FOUNDATION</text>
  </g>
  <text class="sans h1" x="355" y="88">Market-data governance and target definition</text>
  <text class="sans small" x="355" y="127">Provenance, access rights, timezone and adjustment convention</text>
  <text class="sans small" x="355" y="161">Expanding windows • purged t+1 labels • train-only fitting • frozen protocols</text>

  <path fill="none" stroke="#334155" stroke-width="4" d="M 1000 200 L 1000 224"/>
  <path fill="none" stroke="#94A3B8" stroke-width="3" d="M 365 224 L 1635 224"/>
  <path class="line-thin" d="M 365 224 L 365 245"/>
  <path class="line-thin" d="M 1000 224 L 1000 245"/>
  <path class="line-thin" d="M 1635 224 L 1635 245"/>

  <!-- Pillar 2: numerical -->
  <g filter="url(#shadow)">
    <rect x="70" y="245" width="590" height="625" rx="22" fill="#F8FAFC" stroke="#2563EB" stroke-width="3"/>
    <rect x="70" y="245" width="590" height="65" rx="22" fill="#2563EB"/>
    <rect x="70" y="286" width="590" height="24" fill="#2563EB"/>
  </g>
  <text class="sans h2 white" x="365" y="287" text-anchor="middle">PILLAR 2 · NUMERICAL / DENOISING</text>

  <rect class="box" x="115" y="340" width="500" height="90"/>
  <text class="sans body" x="365" y="378" text-anchor="middle">Full technical-analysis feature pool</text>
  <text class="sans tiny" x="365" y="407" text-anchor="middle">Dated market information available through day t</text>

  <path fill="none" stroke="#334155" stroke-width="3" d="M 365 430 L 365 460 M 230 460 L 500 460"/>
  <path class="line-thin" d="M 230 460 L 230 482"/>
  <path class="line-thin" d="M 500 460 L 500 482"/>

  <rect x="115" y="482" width="230" height="105" rx="16" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.5"/>
  <text class="sans body" x="230" y="523" text-anchor="middle">Market-only</text>
  <text class="sans small" x="230" y="555" text-anchor="middle">Full TA baseline</text>

  <rect x="385" y="482" width="230" height="105" rx="16" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.5"/>
  <text class="sans body" x="500" y="518" text-anchor="middle">+ Causal rolling</text>
  <text class="sans body" x="500" y="550" text-anchor="middle">VMD features</text>

  <rect x="115" y="635" width="500" height="125" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  <text class="sans h2" x="365" y="677" text-anchor="middle">Paired VMD ablation</text>
  <text class="sans small" x="365" y="711" text-anchor="middle">Same dates, windows, seeds and architectures</text>
  <text class="sans tiny" x="365" y="741" text-anchor="middle">No full-sample decomposition</text>
  <path class="line-thin" d="M 230 587 L 230 612 L 365 612 L 365 635"/>
  <path class="line-thin" d="M 500 587 L 500 612 L 365 612"/>
  <path class="line" d="M 365 760 L 365 900"/>

  <!-- Pillar 3: multimodal / LLM -->
  <g filter="url(#shadow)">
    <rect x="705" y="245" width="590" height="625" rx="22" fill="#F8FAFC" stroke="#0F766E" stroke-width="3"/>
    <rect x="705" y="245" width="590" height="65" rx="22" fill="#0F766E"/>
    <rect x="705" y="286" width="590" height="24" fill="#0F766E"/>
  </g>
  <text class="sans h2 white" x="1000" y="287" text-anchor="middle">PILLAR 3 · MULTIMODAL / LLM</text>

  <rect class="box" x="750" y="330" width="500" height="72"/>
  <text class="sans body" x="1000" y="360" text-anchor="middle">Eligible dated headlines</text>
  <text class="sans tiny" x="1000" y="386" text-anchor="middle">Available by the fixed information cutoff</text>

  <path fill="none" stroke="#334155" stroke-width="3" d="M 1000 402 L 1000 426 M 865 426 L 1135 426"/>
  <path class="line-thin" d="M 865 426 L 865 450"/>
  <path class="line-thin" d="M 1135 426 L 1135 450"/>

  <rect x="750" y="450" width="230" height="102" rx="16" fill="#ECFDF5" stroke="#34D399" stroke-width="2.5"/>
  <text class="sans body" x="865" y="490" text-anchor="middle">Expanding</text>
  <text class="sans body" x="865" y="521" text-anchor="middle">Local NLP</text>
  <text class="sans tiny" x="865" y="545" text-anchor="middle">OOS predictions</text>

  <rect x="1020" y="450" width="230" height="72" rx="16" fill="#ECFDF5" stroke="#34D399" stroke-width="2.5"/>
  <text class="sans body" x="1135" y="495" text-anchor="middle">Relevance filter</text>
  <path class="line-thin" d="M 1135 522 L 1135 545"/>

  <rect x="1020" y="545" width="230" height="72" rx="16" fill="#ECFDF5" stroke="#34D399" stroke-width="2.5"/>
  <text class="sans body" x="1135" y="576" text-anchor="middle">Bull worker ↔</text>
  <text class="sans body" x="1135" y="605" text-anchor="middle">Bear worker</text>
  <path class="line-thin" d="M 1135 617 L 1135 641"/>

  <rect x="1020" y="641" width="230" height="68" rx="16" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/>
  <text class="sans h2" x="1135" y="684" text-anchor="middle">Leader</text>

  <rect x="750" y="592" width="230" height="117" rx="16" fill="#F0FDFA" stroke="#0F766E" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="sans body" x="865" y="629" text-anchor="middle">Intrinsic sentiment</text>
  <text class="sans body" x="865" y="658" text-anchor="middle">evaluation (2023)</text>
  <text class="sans tiny" x="865" y="690" text-anchor="middle">Compute-matched controls</text>
  <path class="eval-line" d="M 1020 675 L 980 675"/>

  <rect x="750" y="750" width="500" height="82" rx="16" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.5"/>
  <text class="sans body" x="1000" y="783" text-anchor="middle">Dated daily news aggregation</text>
  <text class="sans tiny" x="1000" y="812" text-anchor="middle">Two routes retained: Local NLP and Debate Leader</text>
  <path class="line-thin" d="M 865 552 L 865 570 L 728 570 L 728 726 L 900 726 L 900 750"/>
  <path class="line-thin" d="M 1135 709 L 1135 726 L 1100 726 L 1100 750"/>
  <path class="line" d="M 1000 832 L 1000 900"/>

  <!-- Pillar 4: regime-aware explainability -->
  <g filter="url(#shadow)">
    <rect x="1340" y="245" width="590" height="625" rx="22" fill="#F8FAFC" stroke="#7C3AED" stroke-width="3"/>
    <rect x="1340" y="245" width="590" height="65" rx="22" fill="#7C3AED"/>
    <rect x="1340" y="286" width="590" height="24" fill="#7C3AED"/>
  </g>
  <text class="sans h2 white" x="1635" y="287" text-anchor="middle">PILLAR 4 · REGIME / EXPLAINABILITY</text>

  <rect class="box" x="1385" y="340" width="500" height="75"/>
  <text class="sans body" x="1635" y="371" text-anchor="middle">Numerical history through day t</text>
  <text class="sans tiny" x="1635" y="399" text-anchor="middle">No future regime information</text>
  <path class="line-thin" d="M 1635 415 L 1635 442"/>

  <rect x="1385" y="442" width="500" height="78" rx="16" fill="#F5F3FF" stroke="#A78BFA" stroke-width="2.5"/>
  <text class="sans body" x="1635" y="477" text-anchor="middle">Causal daily market-regime router</text>
  <text class="sans tiny" x="1635" y="504" text-anchor="middle">Assigned using information available at t</text>
  <path class="line-thin" d="M 1635 520 L 1635 546"/>

  <rect x="1385" y="546" width="150" height="66" rx="33" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.5"/>
  <rect x="1560" y="546" width="150" height="66" rx="33" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
  <rect x="1735" y="546" width="150" height="66" rx="33" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text class="sans body" x="1460" y="588" text-anchor="middle">Bull</text>
  <text class="sans body" x="1635" y="588" text-anchor="middle">Sideway</text>
  <text class="sans body" x="1810" y="588" text-anchor="middle">Bear</text>

  <path class="line-thin" d="M 1635 612 L 1635 641"/>
  <rect x="1385" y="641" width="310" height="104" rx="16" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <text class="sans body" x="1540" y="678" text-anchor="middle">Train-only SHAP rankings</text>
  <text class="sans small" x="1540" y="710" text-anchor="middle">Regime-specific feature sets</text>
  <text class="sans tiny" x="1540" y="735" text-anchor="middle">No test-set feature ranking</text>

  <rect x="1720" y="641" width="165" height="104" rx="16" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text class="sans body" x="1802" y="680" text-anchor="middle">Explanation</text>
  <text class="sans body" x="1802" y="709" text-anchor="middle">fidelity</text>
  <text class="sans tiny" x="1802" y="735" text-anchor="middle">Diagnostic</text>
  <path class="eval-line" d="M 1695 693 L 1720 693"/>

  <rect x="1385" y="778" width="500" height="58" rx="16" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2.5"/>
  <text class="sans body" x="1635" y="815" text-anchor="middle">Regime-routed numerical inputs</text>
  <path class="line-thin" d="M 1540 745 L 1540 762 L 1635 762 L 1635 778"/>
  <path class="line" d="M 1635 836 L 1635 900"/>

  <!-- Common architecture panel -->
  <g filter="url(#shadow)">
    <rect x="120" y="900" width="1760" height="140" rx="22" fill="#F1F5F9" stroke="#334155" stroke-width="3"/>
  </g>
  <text class="sans h2" x="1000" y="940" text-anchor="middle">Common horizontal panel: five frozen neural architectures</text>
  <rect x="170" y="963" width="285" height="51" rx="25" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <rect x="495" y="963" width="285" height="51" rx="25" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <rect x="820" y="963" width="285" height="51" rx="25" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <rect x="1145" y="963" width="285" height="51" rx="25" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <rect x="1470" y="963" width="360" height="51" rx="25" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <text class="sans body" x="312" y="996" text-anchor="middle">LSTM</text>
  <text class="sans body" x="637" y="996" text-anchor="middle">CNN</text>
  <text class="sans body" x="962" y="996" text-anchor="middle">LSTM–CNN</text>
  <text class="sans body" x="1287" y="996" text-anchor="middle">LSTM–Attention</text>
  <text class="sans body" x="1650" y="996" text-anchor="middle">LSTM–CNN–Attention</text>

  <path class="line" d="M 1000 1040 L 1000 1075"/>

  <!-- Common forecasting contract -->
  <g filter="url(#shadow)">
    <rect x="300" y="1075" width="1400" height="112" rx="22" fill="#FFF7ED" stroke="#C2410C" stroke-width="3"/>
  </g>
  <text class="sans h2" x="1000" y="1115" text-anchor="middle">Common SET50 next-day direction forecasting contract</text>
  <text class="sans small" x="1000" y="1150" text-anchor="middle">Identical eligible dates, outer years, windows, seeds and balanced-accuracy endpoint</text>

  <!-- Evaluation outputs -->
  <path fill="none" stroke="#334155" stroke-width="3" d="M 1000 1187 L 1000 1212 M 355 1212 L 1645 1212"/>
  <path class="line-thin" d="M 355 1212 L 355 1235"/>
  <path class="line-thin" d="M 1115 1212 L 1115 1261"/>
  <path class="line-thin" d="M 1615 1212 L 1615 1261"/>

  <rect x="90" y="1235" width="530" height="148" rx="18" fill="#F8FAFC" stroke="#334155" stroke-width="2.5"/>
  <text class="sans h2" x="355" y="1278" text-anchor="middle">Historical forecasting</text>
  <text class="sans small" x="355" y="1314" text-anchor="middle">Outer tests: 2022–2025</text>
  <text class="sans tiny" x="355" y="1345" text-anchor="middle">Paired ablations • negative controls • multiplicity</text>

  <!-- Pillar 5 -->
  <g filter="url(#shadow)">
    <rect x="660" y="1235" width="1250" height="148" rx="18" fill="#FFF1F2" stroke="#BE123C" stroke-width="3"/>
  </g>
  <rect x="660" y="1235" width="210" height="148" rx="18" fill="#BE123C"/>
  <text class="sans h2 white" x="765" y="1285" text-anchor="middle">PILLAR 5</text>
  <text class="sans body white" x="765" y="1323" text-anchor="middle">FORWARD &amp;</text>
  <text class="sans body white" x="765" y="1353" text-anchor="middle">TRANSFER</text>

  <rect x="900" y="1261" width="430" height="96" rx="16" fill="#FFFFFF" stroke="#FB7185" stroke-width="2.5"/>
  <text class="sans body" x="1115" y="1299" text-anchor="middle">Forward robustness</text>
  <text class="sans small" x="1115" y="1332" text-anchor="middle">Frozen partial-2026 stress test</text>

  <rect x="1360" y="1261" width="510" height="96" rx="16" fill="#FFFFFF" stroke="#FB7185" stroke-width="2.5"/>
  <text class="sans body" x="1615" y="1299" text-anchor="middle">Same-exchange transfer</text>
  <text class="sans small" x="1615" y="1332" text-anchor="middle">Frozen SET50 → SET100 evaluation</text>

  <!-- Legend -->
  <line x1="610" y1="1442" x2="675" y2="1442" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="sans tiny" x="692" y="1448">data / forecasting flow</text>
  <line x1="1025" y1="1442" x2="1090" y2="1442" stroke="#0F766E" stroke-width="3.5" stroke-dasharray="11 9" marker-end="url(#arrowTeal)"/>
  <text class="sans tiny" x="1107" y="1448">evaluation-only link</text>
</svg>
